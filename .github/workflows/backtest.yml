name: Backtest harness

# Research replay only. This workflow does not run the weekly publisher,
# does not commit, and does not deploy GitHub Pages.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/requirements.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r runtime/requirements.txt

      - name: Replay tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_backtest.py tests/test_v2_candidate.py
