name: Weekly BugOut Index Update

on:
  schedule:
    # cron is 23:30 UTC Friday (`30 23 * * 5`).
    # America/Chicago at that instant:
    #   18:30 Friday during CDT (daylight, UTC-5)
    #   17:30 Friday during CST (standard, UTC-6)
    # US equity markets close at 16:00 ET (21:00 UTC), so this is after
    # the close. GitHub often starts the job late; a start just after
    # 00:00 UTC Saturday is still Friday evening in Chicago.
    # publication_date uses that Chicago calendar date.
    # The previous slot (03:00 UTC Saturday) overlapped FRED maintenance
    # and produced a degraded run on 2026-04-25.
    - cron: "30 23 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

# One publish at a time per branch. The Pages branch uses the group
# bugoutindex-weekly-publish-main. cancel-in-progress is false so a run
# that has already started is not killed mid-commit. A second weekly or
# workflow_dispatch run waits. GitHub keeps only the newest pending run
# in the group and cancels older queued runs, so two jobs never push
# the same branch together.
concurrency:
  group: bugoutindex-weekly-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/requirements.txt

      - name: Install dependencies
        # runtime/requirements.txt is the hashed lock compiled from
        # runtime/requirements.in. --require-hashes refuses an unpinned
        # or tampered install.
        run: python -m pip install --require-hashes -r runtime/requirements.txt

      - name: Run weekly pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m runtime.publish.weekly_run
          code=$?
          set -e
          echo "$code" > "${RUNNER_TEMP}/weekly_run_exit_code"
          # Non-zero fails the job so GitHub's scheduled-run notification fires.
          # The commit step is skipped. docs/ on main stays the last good publish.
          exit "$code"

      - name: Commit updated data & site
        run: |
          git config user.name  "bugout-bot"
          git config user.email "bugout-bot@users.noreply.github.com"
          git add runtime/data/weekly_bugout_index.csv \
                  runtime/data/markets_history.csv \
                  runtime/data/pulse_history.csv \
                  runtime/data/labor_shadow_history.csv \
                  runtime/data/food_shadow_history.csv \
                  docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            RUN_DATE=$(python -c "import json; print(json.load(open('docs/data/latest.json'))['publication_date'])")
            git commit -m "weekly: BugOut Index update for ${RUN_DATE}"
            git push
          fi

      # Visible on the Actions run page without opening the raw log.
      # if: failure() still leaves the job red, so the scheduled-run email is sent.
      - name: Summarize a missed publish
        if: failure()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          code="unknown"
          if [ -f "${RUNNER_TEMP}/weekly_run_exit_code" ]; then
            code=$(tr -d '[:space:]' < "${RUNNER_TEMP}/weekly_run_exit_code")
          fi
          python -m runtime.publish.failure_notice "$code" >> "$GITHUB_STEP_SUMMARY"
          summary=$(python -m runtime.publish.failure_notice --oneline "$code")
          echo "::error title=Weekly publish failed::${summary}"
